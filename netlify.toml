[build]
  command = "npm run build"
  publish = "dist"

# 실제 파일(아이콘·스크린샷 등)이 있으면 그 파일을 먼저 보여주고,
# 없는 경로(/apps/hanmadi 같은 SPA 라우트)만 index.html로 돌려보냅니다.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
