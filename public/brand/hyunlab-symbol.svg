<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    HYUNLAB 심볼

    육각형(Lab) 안에 H와 노드 2개 — 실험실과 연결을 뜻합니다.
    워드마크(HYUNLAB 글자)는 화면에서 HTML 텍스트로 그립니다.
    (SVG 안에 글자를 넣으면 폰트가 적용되지 않아 모양이 달라집니다)

    ⚠️ 기존 홈페이지 화면을 보고 다시 그린 것입니다.
       원본 로고 파일이 있으면 이 파일을 그것으로 바꿔 주세요.
  -->
  <!-- 육각형 -->
  <path
    d="M50 5 L88 27 L88 73 L50 95 L12 73 L12 27 Z"
    stroke="#F5765C"
    stroke-width="7.5"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- H -->
  <rect x="32.5" y="33" width="7.5" height="34" rx="3.75" fill="#F5765C" />
  <rect x="60" y="33" width="7.5" height="34" rx="3.75" fill="#F5765C" />
  <rect x="32.5" y="46.5" width="35" height="7.5" rx="3.75" fill="#F5765C" />

  <!-- 노드 2개 (오른쪽 위 · 왼쪽 아래) -->
  <circle cx="63.75" cy="37" r="7" fill="#FFFFFF" stroke="#F5765C" stroke-width="4.5" />
  <circle cx="36.25" cy="63" r="7" fill="#FFFFFF" stroke="#F5765C" stroke-width="4.5" />
</svg>
